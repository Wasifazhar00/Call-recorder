name: Shizuku-first optimized APK

on:
  push:
    branches: [ "main", "feature/shizuku-first-lean-build" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-callvault:
    name: Build Shizuku-first release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install pinned Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Apply revision-checked Shizuku-first profile
        run: python3 scripts/apply_shizuku_profile.py

      # Build the optimized release variant without requesting upstream release-signing secrets.
      # The resulting unsigned APK is aligned and signed with a disposable CI test key below.
      - name: Build optimized release APK
        working-directory: vendor/CallVault
        run: env -u GITHUB_ACTIONS ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Align and sign with temporary CI test key
        shell: bash
        run: |
          set -euo pipefail
          unsigned="vendor/CallVault/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="vendor/CallVault/app/build/outputs/apk/release/app-release-aligned.apk"
          output="vendor/CallVault/app/build/outputs/apk/release/CallRecorder-shizuku-test.apk"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$unsigned" "$aligned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" --ks-pass pass:android \
            --key-pass pass:android --out "$output" "$aligned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$output"
          ls -lh "$output"

      - name: Upload optimized Shizuku-first APK
        uses: actions/upload-artifact@v4
        with:
          name: call-recorder-shizuku-release-test
          path: vendor/CallVault/app/build/outputs/apk/release/CallRecorder-shizuku-test.apk
          if-no-files-found: error
          retention-days: 30
