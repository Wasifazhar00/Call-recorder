name: Shizuku-first optimized APK

on:
  push:
    branches: [ "main", "feature/shizuku-first-lean-build", "feature/recorder-only-prune" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: call-recorder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-callvault:
    name: Test and build Shizuku-first arm64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and imported source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install pinned Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Apply revision-checked Shizuku-first profile
        run: |
          python3 scripts/apply_shizuku_profile.py
          python3 scripts/apply_shizuku_profile.py
          python3 scripts/verify_shizuku_profile.py
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("upstream/CallVault")
          errors = []
          for path in root.rglob("*.xml"):
              try:
                  ET.parse(path)
              except ET.ParseError as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("All Android XML resources and manifests parse successfully.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("upstream/CallVault/app/src/main/java/com/baba/callvault")
          pattern = re.compile(r"transcri|summar|Transcript|Summary|Whisper|Llama|ModelRepository|ClipTranscriber|TranscriptSidecar|CallSummary|SpeakerTurnsRepository", re.I)
          for path in sorted(root.rglob("*.kt")):
              matches = [(i, line.strip()) for i, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1) if pattern.search(line)]
              if matches:
                  print(f"AIREF {path.relative_to(root)}")
                  for i, line in matches:
                      print(f"  {i}: {line[:240]}")
          PY

      - name: Run release unit tests
        working-directory: upstream/CallVault
        run: env -u GITHUB_ACTIONS ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-recorder-unit-test-reports
          path: |
            upstream/CallVault/app/build/reports/tests/testDebugUnitTest/
            upstream/CallVault/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Android lint
        working-directory: upstream/CallVault
        run: env -u GITHUB_ACTIONS ./gradlew --no-daemon --stacktrace :app:lintRelease

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-recorder-lint-reports
          path: |
            upstream/CallVault/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/
            upstream/CallVault/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14

      # Upstream release signing requires the maintainer's private production key.
      # CI deliberately builds unsigned, then signs with a disposable test key for device trials.
      - name: Build optimized release APK
        working-directory: upstream/CallVault
        run: env -u GITHUB_ACTIONS ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Align, sign and verify test APK
        shell: bash
        run: |
          set -euo pipefail
          unsigned="upstream/CallVault/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="upstream/CallVault/app/build/outputs/apk/release/app-release-aligned.apk"
          output="upstream/CallVault/app/build/outputs/apk/release/CallRecorder-shizuku-test.apk"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$unsigned" "$aligned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" --ks-pass pass:android \
            --key-pass pass:android --out "$output" "$aligned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$output"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$output" | grep -F "package: name='com.baba.callvault'"
          unzip -Z1 "$output" | grep -q '^lib/arm64-v8a/'
          if unzip -Z1 "$output" | grep -E '^lib/' | grep -v '^lib/arm64-v8a/' ; then
            echo "Unexpected non-arm64 native library found" >&2
            exit 1
          fi
          echo "APK_BYTES=$(stat -c '%s' "$output")" | tee apk-metrics.txt
          echo "APK_SHA256=$(sha256sum "$output" | awk '{print $1}')" | tee -a apk-metrics.txt
          echo "NATIVE_ABIS=$(unzip -Z1 "$output" | grep '^lib/' | cut -d/ -f2 | sort -u | paste -sd, -)" | tee -a apk-metrics.txt
          ls -lh "$output"

      - name: Upload optimized Shizuku-first APK and metrics
        uses: actions/upload-artifact@v4
        with:
          name: call-recorder-shizuku-release-test
          path: |
            upstream/CallVault/app/build/outputs/apk/release/CallRecorder-shizuku-test.apk
            apk-metrics.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified recorder-only source profile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream/CallVault
          if git diff --cached --quiet; then
            echo "Recorder-only source profile is already committed."
          else
            git commit -m "Apply recorder-only profile and remove AI native runtimes"
            git fetch origin feature/recorder-only-prune
            git rebase origin/feature/recorder-only-prune
            git push origin HEAD:feature/recorder-only-prune
          fi
