name: CallVault upstream debug APK

on:
  push:
    branches: [ "main", "feature/callvault-integration" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-callvault:
    name: Build pinned CallVault debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install pinned Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Build upstream debug APK
        working-directory: vendor/CallVault
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload upstream debug APK
        uses: actions/upload-artifact@v4
        with:
          name: callvault-upstream-debug-apk
          path: vendor/CallVault/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
